# Example source config. Validated in CI as a smoke test of the config
# schema; never deployed. Real configs live beside it, one directory per
# custodian, one file per source named <source id>.yaml.
config_version: 0

source:
  id: pershing_position
  custodian: pershing
  file_type: position
  family: pershing_gcus
  tier: medium
  description: Pershing GCUS position file, one record per account and security.

spec:
  id: pershing_gcus            # specs/pershing_gcus/
  version: "2017-07-25"        # specs/pershing_gcus/2017-07-25.yaml

pattern: fixed_width_multi_record   # pattern library id that parses the spec
target_profile: snowflake_iceberg   # a profile with renderers (astra_data.targets)
domain_pack: custodial              # domains/custodial; its latest canonical model is the target
effective_from: 2026-09-01

owner:
  name: Data steward, custodial
  email: steward@example.com

# Canonical column <- spec field (of the spec's logical record), with an
# optional transform from the renderers' vocabulary and the rule that governs it.
mappings:
  - target: position.account_number
    source: account_number
  - target: position.custodian_security_id
    source: cusip
  - target: position.as_of_date
    source: as_of_date
  - target: position.quantity
    source: quantity
    transform: signed_implied_decimal(13, 5)
    rule: pershing_gcus.quantity_sign
  - target: position.price
    source: price
    transform: implied_decimal(6)
  - target: position.position_type
    constant: LONG
  - target: position.currency
    constant: USD

# Custodian identifiers become platform identifiers by joining the replicated
# reference data (domains/custodial/reference-data.yaml); what cannot be
# resolved becomes an exception with the code named here.
resolution:
  account:
    source: account_number
    require_open: true
  security:
    by:
      - { identifier: CUSIP, source: cusip }
  price:
    when: missing
    lookback_days: 5

# Rule catalog entries this config depends on (rules/<group>/<name>.yaml).
# The catalog holds the rule's text, citation, owner and status; a rejected
# rule fails validation here.
rules:
  - pershing_gcus.quantity_sign

dq_rules:
  - id: trailer_control_total
    kind: control_total
    level: file
    check: trailer record count equals the number of detail records
    trailer_field: detail_count
    aggregate: count
    severity: error
    owner: steward@example.com
  - id: cusip_present
    kind: not_null
    level: record
    check: every detail record names a security
    field: cusip
    severity: warning
    owner: steward@example.com
  - id: price_not_negative
    kind: range
    level: record
    check: a reported price is never negative
    field: price
    min: 0
    severity: info
    owner: steward@example.com

# How stale the parsed tables may be and how often the source is processed.
processing:
  target_lag_minutes: 10

# When the custodian delivers and what is expected. Shared by every source of
# the same custodian; a 'late' alert lists whichever of these is missing after
# the cutoff on a business day.
delivery:
  cutoff_time: "06:00"
  timezone: America/New_York
  business_days: [mon, tue, wed, thu, fri]
  files:
    - pattern: pershing/GCUS_%_POS_%.dat
      description: Positions
    - pattern: pershing/GCUS_%_TRN_%.dat
      description: Transactions

# Alert severity for this custodian. Routes per severity are operations data.
alerts:
  late: error
  task_failure: error
