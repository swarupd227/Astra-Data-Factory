[project]
name = "astra-agents"
version = "0.1.0"
description = "Astra Data Factory agents plane: bounded agent workers, starting with the Spec Reader."
requires-python = ">=3.11"
dependencies = [
  "astra-core",
  "astra-knowledge",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# The real LLM client. Not needed to import astra_agents.spec_reader itself — the
# extraction interface is a Protocol; a fake client needs none of this.
llm = [
  "anthropic>=1.0",
]
pdf = [
  "pdfplumber>=0.11",
]
docx = [
  "python-docx>=1.1",
]
dev = [
  "pytest>=8",
  "anthropic>=1.0",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
]

[project.scripts]
astra-agents = "astra_agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../knowledge/src", "../core/src"]
