rule:
  id: pershing_gcus.quantity_sign
  text: "Quantity is unsigned digits with five implied decimals; the sign is the following one-character field, where '+' is long and '-' is short. A blank sign means the sign is unknown and the quantity is not zero, so the value is null rather than zero."
  class: normalisation
