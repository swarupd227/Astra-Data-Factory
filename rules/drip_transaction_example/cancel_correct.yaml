rule:
  id: drip_transaction_example.cancel_correct
  text: "A record with action X cancels the transaction named in the original transaction id: the original is marked cancelled and both records point at each other. A record with action C corrects it: the original is marked superseded and the correction becomes the active transaction. A cancel or correction whose original has not been seen, or is already closed, is rejected."
