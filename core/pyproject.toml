[project]
name = "astra-core"
version = "0.1.0"
description = "Shared building blocks of Astra Data Factory: line-aware YAML, problem reporting, schema error wording, Snowflake connection."
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
snowflake = [
  "snowflake-connector-python>=3.12",
]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
