# Validation for the platform foundation on every change.
# Runs without any account: Terraform format check, validate and unit tests
# against mocked providers; Python unit tests for the Open Catalog tool.
# Plan and apply against real environments arrive with S1.2.2 (CI/CD).

name: foundation

on:
  pull_request:
    paths:
      - "infra/terraform/foundation/**"
      - "tools/opencatalog/**"
      - ".github/workflows/terraform-foundation.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/foundation/**"
      - "tools/opencatalog/**"
      - ".github/workflows/terraform-foundation.yml"

permissions:
  contents: read

jobs:
  opencatalog:
    name: opencatalog tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/opencatalog
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -q

  terraform:
    name: terraform fmt, validate, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/foundation
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - name: Init (no backend)
        run: terraform init -input=false -backend=false

      - name: Validate
        run: terraform validate

      - name: Unit tests
        run: terraform test

      - name: Module tests
        working-directory: infra/terraform/foundation/modules/private-bucket
        run: |
          terraform init -input=false -backend=false
          terraform test

      - name: Environment files plan completely
        run: |
          for e in dev qa uat prod; do
            echo "== $e"
            terraform test -test-directory=tests/environments -var-file="environments/$e.tfvars"
          done
