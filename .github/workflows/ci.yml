# Checks on every pull request and on main. Nothing here needs an account
# except the optional dev plan, which runs when the repository variable
# DEV_PLAN_ENABLED is "true" and the dev environment is configured
# (see docs/runbooks/ci-cd-setup.md).

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No secret value in Git (S1.2.5). Scans the whole history on push and the
  # pull request's commits on pull_request, with the allow-list in .gitleaks.toml.
  secrets-scan:
    name: no secrets in git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history
        run: gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  configs:
    name: configs and release bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install astra-core, astra-knowledge and astra-data
        run: python -m pip install -e core -e knowledge -e "generation[dev]"

      # Problems are printed as workflow annotations, so a failing pull request
      # shows each message on the offending file and line.
      - name: Validate the spec registry
        run: astra-spec --format github validate

      - name: Validate configs against the schema and the spec registry
        run: astra-data --format github validate --specs specs configs

      - name: Check release bundles
        run: astra-data --format github bundles check releases

  core:
    name: astra-core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  knowledge:
    name: astra-knowledge tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: knowledge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ../core -e ".[dev]"
      - run: python -m pytest -q

  generation:
    name: astra-data tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: generation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ../core -e ../knowledge -e ".[dev]"
      - run: python -m pytest -q

  verification:
    name: astra-verification tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ../core -e ../knowledge -e ../generation -e ".[dev]"
      - run: python -m pytest -q

  opencatalog:
    name: opencatalog tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/opencatalog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  terraform:
    name: terraform fmt, validate, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/foundation
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - name: Init (no backend)
        run: terraform init -input=false -backend=false

      - name: Validate
        run: terraform validate

      - name: Unit tests
        run: terraform test

      - name: Module tests
        working-directory: infra/terraform/foundation/modules/private-bucket
        run: |
          terraform init -input=false -backend=false
          terraform test

      - name: Environment files plan the standard inventory
        run: |
          for f in environments/*.tfvars; do
            echo "== $f"
            terraform test -test-directory=tests/environments -var-file="$f"
          done

      - name: Environments differ only by variables
        run: sh scripts/check-env-parity.sh

      - name: Bootstrap root validates
        working-directory: infra/terraform/bootstrap
        run: |
          terraform fmt -check -diff
          terraform init -input=false -backend=false
          terraform validate

  plan-dev:
    name: plan dev
    if: github.event_name == 'pull_request' && vars.DEV_PLAN_ENABLED == 'true'
    needs: [configs, terraform]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: infra/terraform/foundation
    env:
      SNOWFLAKE_ORGANIZATION_NAME: ${{ vars.SNOWFLAKE_ORGANIZATION_NAME }}
      SNOWFLAKE_ACCOUNT_NAME: ${{ vars.SNOWFLAKE_ACCOUNT_NAME }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
      SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Same rule as the deploy: secrets from the client's secret manager,
      # masked as they are read; GitHub secrets only as the fallback.
      - name: Resolve secrets
        env:
          PREFIX: ${{ vars.SECRETS_PREFIX }}
          FALLBACK_SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          FALLBACK_OPEN_CATALOG_CLIENT_SECRET: ${{ secrets.OPEN_CATALOG_CLIENT_SECRET }}
          FALLBACK_SLACK_WEBHOOK_SECRET: ${{ secrets.SLACK_WEBHOOK_SECRET }}
          FALLBACK_JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          set -euo pipefail
          export_secret() {
            local value=""
            if [ -n "$PREFIX" ]; then
              value=$(aws secretsmanager get-secret-value --secret-id "$PREFIX/$2" --query SecretString --output text 2>/dev/null || true)
            else
              value="$3"
            fi
            if [ -n "$value" ]; then
              while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$value"
              { echo "$1<<ASTRA_SECRET_EOF"; echo "$value"; echo "ASTRA_SECRET_EOF"; } >> "$GITHUB_ENV"
            fi
          }
          export_secret SNOWFLAKE_PRIVATE_KEY             snowflake/private-key      "$FALLBACK_SNOWFLAKE_PRIVATE_KEY"
          export_secret TF_VAR_open_catalog_client_secret open-catalog/client-secret "$FALLBACK_OPEN_CATALOG_CLIENT_SECRET"
          export_secret TF_VAR_slack_webhook_secret       alerts/slack-webhook       "$FALLBACK_SLACK_WEBHOOK_SECRET"
          export_secret TF_VAR_jira_api_token             alerts/jira-token          "$FALLBACK_JIRA_API_TOKEN"

      - name: Init
        run: terraform init -input=false -backend-config=environments/backend-dev.hcl -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Plan
        id: plan
        run: |
          terraform plan -input=false -no-color -lock=false -var-file=environments/dev.tfvars -out=dev.tfplan
          terraform show -no-color dev.tfplan > plan.txt
          {
            echo "## Terraform plan: dev"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/foundation/plan.txt', 'utf8');
            const marker = '<!-- astra-data-factory plan dev -->';
            const summary = (plan.match(/Plan: .*|No changes\..*/) || ['see details'])[0];
            const body = `${marker}\n**Terraform plan for dev:** ${summary}\n\n<details><summary>Full plan</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
