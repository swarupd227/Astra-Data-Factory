# Weekly agent evaluation report (S4.3.4, ADR 0040): every agent that has both a gold set
# and a predictions.yaml is scored, precision and recall published by tier across every
# agent — "metrics visible to the client: per agent, per tier, per week" (product spec
# Section 11). Nothing here needs a Snowflake account; the harness only reads files.
#
# agents/pattern_matcher (S5.3.1, ADR 0043) is the first real agent scored here — a real gold
# set against real specs already in this repository, not a stand-in. The Spec Reader's own
# gold set (agents/spec_reader/) needs a person to review a real extraction first (ADR 0041)
# and is not built yet; its worked example lives under agents/examples/ instead, one
# directory deeper than this job's discovery looks, so it is not part of this report. A later
# agent's own predictions.yaml joins agents/<agent>/ the same way, with no change to this
# workflow.

name: agent evaluation weekly

on:
  schedule:
    - cron: "0 8 * * 1" # Monday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-report:
    name: score every agent and publish the weekly report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install astra-core, astra-knowledge, astra-data and astra-verification
        run: python -m pip install -e core -e knowledge -e "generation[dev]" -e verification

      - name: Score every agent and publish the weekly report
        run: astra-verify agent-eval report agents --out work/agent-eval/weekly

      - name: Add the report to the job summary
        if: always()
        run: cat work/agent-eval/weekly/weekly.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-eval-weekly
          path: work/agent-eval/weekly/
          retention-days: 90
