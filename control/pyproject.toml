[project]
name = "astra-control"
version = "0.1.0"
description = "Astra Data Factory control plane: the factory board, config studio and diff review."
requires-python = ">=3.11"
dependencies = [
  "astra-core",
  "astra-knowledge",
  "astra-data",
  "astra-verification",
  "pyyaml>=6.0",
  "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pdfplumber>=0.11",
]

[project.scripts]
astra-control = "astra_control.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../core/src", "../knowledge/src", "../generation/src", "../verification/src"]
