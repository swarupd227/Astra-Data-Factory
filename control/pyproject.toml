[project]
name = "astra-control"
version = "0.1.0"
description = "Astra Data Factory control plane: the factory board, approvals and workflow. Starting with the factory board."
requires-python = ">=3.11"
dependencies = [
  "astra-core",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
astra-control = "astra_control.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../core/src"]
