[project]
name = "astra-data"
version = "0.1.0"
description = "Astra Data: validates source configs and deploys and tests release bundles. The generation plane grows here."
requires-python = ">=3.11"
dependencies = [
  "astra-core",
  "astra-knowledge",
  "pyyaml>=6.0",
  "jsonschema>=4.20",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
# `astra-data deploy` and `astra-data test` talk to Snowflake.
deploy = [
  "snowflake-connector-python>=3.12",
]
# `astra-data bundles lint` parses the generated tests with the Snowflake dialect.
lint = [
  "sqlglot>=25",
]
dev = [
  "pytest>=8",
  "sqlglot>=25",
  # runs the rendered reconciliation SQL over seeded tables, to check it against its reference implementation
  "duckdb>=1.0",
]

[project.scripts]
astra-data = "astra_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../core/src", "../knowledge/src"]
