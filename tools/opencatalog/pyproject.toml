[project]
name = "astra-opencatalog"
version = "0.1.0"
description = "Provisions and verifies the Snowflake Open Catalog side of an Astra Data Factory environment."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
# Needed only by `opencatalog verify`, which creates a probe table in Snowflake
# and reads it back through the Iceberg REST catalog with DuckDB.
verify = [
  "snowflake-connector-python>=3.12",
  "duckdb>=1.3",
]
dev = [
  "pytest>=8",
]

[project.scripts]
opencatalog = "astra_opencatalog.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_opencatalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
