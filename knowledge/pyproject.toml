[project]
name = "astra-knowledge"
version = "0.1.0"
description = "Astra Data Factory knowledge plane: the spec registry, and later the pattern library, domain packs and rule catalog."
requires-python = ">=3.11"
dependencies = [
  "astra-core",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
astra-spec = "astra_knowledge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_knowledge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../core/src"]
